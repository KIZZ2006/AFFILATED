name: Yasna Automated Marketing Pipeline

on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Product Name'
        required: true
        default: 'Electric Coffee Grinder'
      price:
        description: 'Product Price'
        required: true
        default: '$24.99'
      features:
        description: 'Key Features (comma separated)'
        required: true
        default: 'one-touch operation, stainless steel blades, compact design'
      niche:
        description: 'Product Niche'
        required: true
        default: 'kitchen gadgets'

  schedule:
    # Runs daily at 09:00 AM UTC (2:30 PM IST)
    - cron: '0 9 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & System Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -r requirements.txt
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.0/en_core_web_sm-3.7.0-py3-none-any.whl

      - name: Execute Yasna Pipeline
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AMAZON_ASSOCIATE_ID: ${{ secrets.AMAZON_ASSOCIATE_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PUBLIC_HOST_ENDPOINT: ${{ secrets.PUBLIC_HOST_ENDPOINT }}
        run: |
          PRODUCT="${{ github.event.inputs.product || 'Electric Coffee Grinder' }}"
          PRICE="${{ github.event.inputs.price || '$24.99' }}"
          FEATURES="${{ github.event.inputs.features || 'one-touch operation, stainless steel blades, compact design' }}"
          NICHE="${{ github.event.inputs.niche || 'kitchen gadgets' }}"
          
          python main.py --product "$PRODUCT" --price "$PRICE" --features "$FEATURES" --niche "$NICHE" --publish "instagram"

      - name: Deploy Storefront to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
