name: Publish Next Queued Video

on:
  schedule:
    # Runs twice a day (7:00 AM UTC and 7:00 PM UTC)
    - cron: '0 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute publish_next.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_PUBLISH_ENABLED: ${{ secrets.AUTO_PUBLISH_ENABLED }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN_ISSUED_DATE: ${{ secrets.IG_TOKEN_ISSUED_DATE }}
          YT_CLIENT_SECRET_PATH: ${{ secrets.YT_CLIENT_SECRET_PATH }}
          YT_TOKEN_PATH: ${{ secrets.YT_TOKEN_PATH }}
          AMAZON_ASSOCIATE_ID: ${{ secrets.AMAZON_ASSOCIATE_ID }}
          PUBLIC_HOST_ENDPOINT: ${{ secrets.PUBLIC_HOST_ENDPOINT }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python publish_next.py

      - name: Commit & Push updated queue.json
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.json output/ || true
          git commit -m "chore: publish next queued video [skip ci]" || echo "No changes to commit"
          git push
